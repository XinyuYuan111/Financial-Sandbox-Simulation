[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parallel-market-sandbox"
version = "0.2.0"
description = "Framework Alpha for a replayable, forkable crypto market sandbox"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
openai = [
  "openai>=2,<3",
]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["sandbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
