<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>EPOCH ONE</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand">
      <h1>EPOCH ONE</h1>
    </div>
    <div id="metric-strip" class="mono hidden">
      <span>最新成交 <strong id="metric-price">--</strong></span>
      <span>最优买卖 <strong id="metric-bid">--</strong> / <strong id="metric-ask">--</strong></span>
      <span>累计成交 <strong id="metric-volume">--</strong></span>
      <span id="metric-spread-wrap" class="hidden">价差 <strong id="metric-spread">--</strong> bps</span>
    </div>
    <div class="top-right">
      <div class="top-metrics mono">
        <span id="world-clock">世界时 --:--:--</span>
        <span id="agent-count-label">AGENTS 6</span>
        <span id="seal-countdown">封存 01:30</span>
        <span id="mode-wrap"><span id="mode-tag">模拟</span><i id="remote-dot" class="hidden"></i></span>
      </div>
      <button id="toggle-metrics" class="mono" title="展开/收起订单簿">指标▼</button>
      <button id="scenario-btn" class="mono" title="场景配置">场景</button>
      <button id="pause-btn" class="mono">暂停</button>
      <button id="reset-btn" class="mono">重置</button>
      <input type="range" id="agent-slider" min="3" max="12" step="1" value="6" aria-label="Agent 数量">
    </div>
  </header>

  <main id="main">

    <aside id="inject-panel">
      <div class="panel-header">
        <div class="panel-title mono">信息注入台</div>
        <div id="panel-tabs-left" class="panel-tabs mono">
          <button class="tab-btn selected" data-tab="inject">信息注入</button>
          <button class="tab-btn" data-tab="intervention">干预效果</button>
        </div>
      </div>

      <!-- 信息注入标签页 -->
      <div id="inject-tab" class="tab-content visible">
        <textarea id="inject-text" rows="4" placeholder="写一条你想放进世界的消息……"></textarea>
        <div class="channels mono" id="channels">
          <label><input type="radio" name="channel" value="flash" checked><span>公开快讯</span></label>
          <label><input type="radio" name="channel" value="official"><span>官方公告</span></label>
          <label><input type="radio" name="channel" value="terminal"><span>终端数据</span></label>
          <label><input type="radio" name="channel" value="private"><span>私信</span></label>
        </div>
        <div id="private-target-wrap" class="hidden">
          <select id="private-target" class="mono"></select>
        </div>
        <button id="inject-btn">注 入</button>
        <div id="watch-strip" class="mono"></div>
        <div id="roster"></div>
        <div id="info-list"></div>
      </div>

      <!-- 干预效果标签页 -->
      <div id="intervention-tab" class="tab-content">
        <select id="effect-type" class="mono" style="width: 100%; margin-bottom: 10px;">
          <option value="publish_information">◇ 发布信息</option>
          <option value="set_market_status">▽ 市场停牌</option>
          <option value="set_account_freeze">△ 账户冻结</option>
          <option value="transfer_asset">○ 资产转移</option>
          <option value="create_world_entity">☰ 创建实体</option>
          <option value="create_relationship">✕ 创建关系</option>
          <option value="set_wallet_access">⌘ 钱包权限</option>
        </select>
        <div id="effect-fields"></div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
          <button id="add-effect-btn" class="mono" style="flex: 1; background: var(--panel-2);">+ 添加</button>
          <button id="submit-intervention-btn" class="mono" style="flex: 1; background: var(--cinnabar); color: var(--bg);">提交干预</button>
        </div>
        <div id="intervention-queue" style="margin-top: 10px; font-size: 10px;"></div>
      </div>
    </aside>

    <section id="stage">
      <div id="stage-tint"></div>
      <div class="fog fog-a"></div>
      <div class="fog fog-b"></div>
      <svg id="stage-ground" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1000 600"></svg>
      <div id="pulse-wrap">
        <svg id="pulse-svg" preserveAspectRatio="none">
          <g id="vol-bars"></g>
          <path id="pulse-area"></path>
          <path id="pulse-ghost"></path>
          <path id="pulse-path"></path>
          <circle id="pulse-dot" r="2.4"></circle>
        </svg>
        <div id="pulse-readout" class="mono">
          <div id="pulse-price">--</div>
          <div id="pulse-change">--</div>
        </div>
        <div class="sim-tag mono">模拟</div>
      </div>
      <svg id="link-layer"></svg>
      <div id="pawn-layer"></div>
      <div id="fx-layer"></div>
      <div id="standby-veil">
        <div class="sb-inner">
          <div class="sb-label mono">STANDBY</div>
          <button id="start-btn">开 始</button>
        </div>
      </div>
    </section>

    <aside id="ledger-panel">
      <div class="panel-header">
        <div class="panel-title mono">世界账本</div>
        <div id="panel-tabs-right" class="panel-tabs mono">
          <button class="tab-btn selected" data-tab="ledger">账本</button>
          <button class="tab-btn" data-tab="events">事件</button>
          <button class="tab-btn" data-tab="archive">归档</button>
        </div>
      </div>

      <!-- 账本标签页 -->
      <div id="ledger-tab" class="tab-content visible">
        <div id="ledger-list" class="mono"></div>
        <div id="ledger-foot" class="mono">Injective EVM 语义 · 模拟演示</div>
      </div>

      <!-- 事件浏览标签页 -->
      <div id="events-tab" class="tab-content">
        <input type="text" id="event-search" class="mono" placeholder="搜索事件" style="width: 100%; margin-bottom: 8px; padding: 4px; background: var(--panel-2); border: 1px solid var(--hairline); color: var(--ink); border-radius: 2px;">
        <select id="event-visibility" class="mono" style="width: 100%; margin-bottom: 8px; padding: 4px; background: var(--panel-2); border: 1px solid var(--hairline); color: var(--ink); border-radius: 2px;">
          <option value="all">全部可见性</option>
          <option value="public">public</option>
          <option value="participants">participants</option>
          <option value="private">private</option>
        </select>
        <div id="event-list" class="mono" style="font-size: 9px; max-height: 400px; overflow-y: auto;"></div>
      </div>

      <!-- 归档标签页 -->
      <div id="archive-tab" class="tab-content">
        <button id="archive-now" class="mono" style="width: 100%; margin-bottom: 8px; padding: 7px 0; background: transparent; border: 1px solid var(--hairline-2); color: var(--ink-dim); border-radius: 2px; cursor: pointer; letter-spacing: 2px;">立即封存快照</button>
        <div id="archive-list" class="mono"></div>
      </div>
    </aside>

  </main>

  <!-- Agent 详情侧滑 -->
  <div id="agent-detail-slide" class="slide-panel slide-left hidden">
    <div class="slide-header">
      <h2 id="agent-slide-name">Agent</h2>
      <button class="slide-close" onclick="window.__sandbox.closeSlidePanels()">✕</button>
    </div>
    <div class="slide-tabs mono">
      <button class="slide-tab-btn selected" data-slide-tab="overview">概览</button>
      <button class="slide-tab-btn" data-slide-tab="memory">记忆</button>
      <button class="slide-tab-btn" data-slide-tab="decisions">决策</button>
      <button class="slide-tab-btn" data-slide-tab="trades">成交</button>
    </div>
    <div id="agent-slide-overview" class="slide-tab visible" style="font-size: 10px;"></div>
    <div id="agent-slide-memory" class="slide-tab" style="font-size: 10px;"></div>
    <div id="agent-slide-decisions" class="slide-tab" style="font-size: 10px;"></div>
    <div id="agent-slide-trades" class="slide-tab" style="font-size: 10px;"></div>
  </div>

  <!-- 订单簿侧滑 -->
  <div id="orderbook-slide" class="slide-panel slide-right hidden">
    <div class="slide-header">
      <h2>订单簿 & 市场</h2>
      <button class="slide-close" onclick="window.__sandbox.closeSlidePanels()">✕</button>
    </div>
    <div class="slide-content">
      <div style="font-size: 10px; margin-bottom: 12px;">
        <div style="margin-bottom: 8px;">
          <strong>成交带</strong> <span id="orderbook-trade-count">0</span> 笔
        </div>
        <div id="orderbook-trades" style="max-height: 150px; overflow-y: auto; border: 1px solid var(--hairline); padding: 4px; border-radius: 2px; background: var(--panel-2);"></div>
      </div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 10px;">
        <div>
          <strong style="color: #5B8DBE;">买盘</strong>
          <table id="orderbook-bids" style="width: 100%; border-collapse: collapse;">
            <thead><tr><th>价格</th><th>量</th><th>来源</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
        <div>
          <strong style="color: #C9922A;">卖盘</strong>
          <table id="orderbook-asks" style="width: 100%; border-collapse: collapse;">
            <thead><tr><th>价格</th><th>量</th><th>来源</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 干预计划底舱 -->
  <div id="plan-dock" class="hidden">
    <div class="dock-head">
      <span class="mono">干预计划</span>
      <span id="plan-dock-hint" class="mono">提交后自动展开 · 可随时终止生效中的计划</span>
      <button class="slide-close" id="plan-dock-close">✕</button>
    </div>
    <div id="plan-list"></div>
  </div>

  <!-- 场景配置弹窗 -->
  <div id="scenario-modal" class="modal-veil hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>场景配置</h2>
        <button class="slide-close" id="scenario-close">✕</button>
      </div>
      <label class="eff-field"><span>场景名称</span><input id="sc-name" class="mono" type="text" value="EPOCH ONE"></label>
      <label class="eff-field"><span>随机种子（相同种子市场路径可重放）</span><input id="sc-seed" class="mono" type="number" value="20260725"></label>
      <label class="eff-field"><span>Agent 数量（3 – 12）</span><input id="sc-agents" class="mono" type="number" min="3" max="12" value="6"></label>
      <label class="eff-field"><span>初始价格</span><input id="sc-price" class="mono" type="number" min="1" value="100"></label>
      <label class="eff-field"><span>波动强度（0.3 – 2.5）</span><input id="sc-vol" class="mono" type="number" step="0.1" min="0.3" max="2.5" value="1"></label>
      <div class="modal-actions">
        <button id="scenario-apply">应用并重置世界</button>
      </div>
      <div class="audit-note">Agent 发言与时机含现场随机，不完全复现；种子只锁定市场路径。</div>
    </div>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
